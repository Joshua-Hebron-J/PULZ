<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PULZ — Select Role</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet"/>

                        "on-secondary-fixed": "#001f24",
                        "background": "#0c0f0f",
                        "on-error-container": "#ffdad6",
                        "emergency-red-border": "rgba(255, 83, 91, 0.4)",
                        "secondary-fixed": "#b5ecf7",
                        "on-tertiary-fixed": "#002115",
                        "secondary-fixed-dim": "#99cfda",
                        "on-background": "#ece0df",
                        "on-tertiary-fixed-variant": "#15503b",
                        "primary": "#ffdad8",
                        "outline-variant": "#524343",
                        "on-secondary-container": "#8bc1cc",
                        "surface-container-lowest": "#120d0d",
                        "on-primary": "#680011",
                        "surface-container": "#1e2020",
                        "surface-tint": "#ffb3b1",
                        "surface": "#121414",
                        "tertiary-fixed-dim": "#99d3b7",
                        "surface-container-low": "#201a1a",
                        "inverse-primary": "#894e4d",
                        "on-tertiary": "#003826",
                        "on-tertiary-container": "#245c46",
                        "inverse-surface": "#ece0df",
                        "emergency-red-text": "#ffdad8",
                        "surface-variant": "#3a3333",
                        "primary-fixed": "#ffdad8",
                        "support-blue-text": "#9cefff",
                        "on-secondary": "#00363d",
                        "support-blue-border": "rgba(0, 227, 253, 0.4)",
                        "tertiary-fixed": "#b4efd2",
                        "surface-dim": "#181212",
                        "emergency-red-bg": "rgba(147, 0, 10, 0.3)",
                        "tertiary-container": "#99d3b7",
                        "on-primary-fixed": "#370d0e",

                        "outline": "#ab8987",
                        "on-surface": "#ece0df",
                        "on-primary-fixed-variant": "#6d3737",
                        "tertiary": "#b4efd2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xs": "8px",
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px",
                        "base": "4px",

                    "fontFamily": {

                        "display-lg": ["56px", {"lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "800"}]

                }
            }
        }

<style>
        .material-symbols-outlined[data-weight="300"] {
            font-variation-settings: 'wght' 300, 'FILL' 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen flex flex-col text-on-background" style="background: radial-gradient(circle at center, #1a0a0a 0%, #0c0f0f 100%);">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-background text-primary dark:text-primary flex items-center justify-between px-margin-mobile h-16 z-50">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-title-lg font-title-lg" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tighter absolute left-1/2 -translate-x-1/2">PULZ</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl max-w-4xl mx-auto w-full">
<div class="text-center mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-xs">Select your role</h2>
<p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-on-surface-variant max-w-md mx-auto">Identify your purpose within the emergency blood network to access relevant tools.</p><p class="font-label-md text-label-md text-outline-variant mt-base uppercase tracking-[0.2em]">Secure Access Portal</p>
</div>
<div class="flex flex-col gap-md w-full mb-xl max-w-2xl mx-auto">
<!-- Recipient Card -->
<button class="bg-surface-container-low border border-outline-variant rounded-xl p-lg flex items-center gap-lg w-full hover:bg-surface-container-high transition-all hover:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary group text-left">
<div class="flex-shrink-0 w-16 h-16 rounded-full bg-emergency-red-bg border border-emergency-red-border flex items-center justify-center shadow-[0_0_15px_rgba(147,0,10,0.2)]">
<span class="material-symbols-outlined text-headline-lg text-emergency-red-text">add_circle</span>
</div>
<div class="flex-grow">
<div class="flex items-center justify-between mb-xs">
<h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-primary transition-colors">Recipient</h3>
<span class="font-label-md text-label-md bg-emergency-red-bg border border-emergency-red-border text-emergency-red-text px-sm py-base rounded-full uppercase tracking-wider">REQUEST</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">I need blood or am requesting for a patient.</p>
</div>
</button>
<!-- Donor Card -->
<button class="bg-surface-container-low border border-outline-variant rounded-xl p-lg flex items-center gap-lg w-full hover:bg-surface-container-high transition-all hover:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-secondary group text-left">
<div class="flex-shrink-0 w-16 h-16 rounded-full bg-support-blue-bg border border-support-blue-border flex items-center justify-center shadow-[0_0_15px_rgba(0,54,61,0.2)]">
<span class="material-symbols-outlined text-headline-lg text-support-blue-text">water_drop</span>
</div>
<div class="flex-grow">
<div class="flex items-center justify-between mb-xs">
<h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-secondary transition-colors">Donor</h3>
<span class="font-label-md text-label-md bg-support-blue-bg border border-support-blue-border text-support-blue-text px-sm py-base rounded-full uppercase tracking-wider">DONATE</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">I want to pledge or donate blood.</p>
</div>
</button>
<!-- Hospital Card -->
<button class="bg-surface-container-low border border-outline-variant rounded-xl p-lg flex items-center gap-lg w-full hover:bg-surface-container-high transition-all hover:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-on-surface-variant group text-left">
<div class="flex-shrink-0 w-16 h-16 rounded-full bg-tertiary-container border border-tertiary flex items-center justify-center">
<span class="material-symbols-outlined text-headline-lg text-on-tertiary-container">local_hospital</span>
</div>
<div class="flex-grow">
<h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-white transition-colors">Hospital</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Authorized medical facility management.</p>
</div>
</button>
<!-- Blood Bank Card -->
<button class="bg-surface-container-low border border-outline-variant rounded-xl p-lg flex items-center gap-lg w-full hover:bg-surface-container-high transition-all hover:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-on-surface-variant group text-left">
<div class="flex-shrink-0 w-16 h-16 rounded-full bg-secondary-container border border-secondary flex items-center justify-center shadow-[0_0_15px_rgba(0,54,61,0.2)]">
<span class="material-symbols-outlined text-headline-lg text-on-secondary-container">qr_code_scanner</span>
</div>
<div class="flex-grow">
<h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-white transition-colors">Blood Bank</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Inventory and unit verification node.</p>
</div>
</button>
</div>
<div class="mt-md text-center"><div class="w-24 h-px bg-outline-variant/30 mx-auto mb-lg"></div>
<a class="font-body-md text-body-md text-outline-variant hover:text-on-surface-variant transition-colors underline decoration-outline-variant/50 underline-offset-4" href="#">How PULZ works without internet</a>
</div>
</main>
</body></html>
